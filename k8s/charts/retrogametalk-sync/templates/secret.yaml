{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "retrogametalk-sync.secretName" . }}
  labels:
    {{- include "retrogametalk-sync.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.credentials.username }}
  RGT_USERNAME: {{ .Values.credentials.username | quote }}
  {{- end }}
  {{- if .Values.credentials.password }}
  RGT_PASSWORD: {{ .Values.credentials.password | quote }}
  {{- end }}
  {{- if .Values.credentials.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.credentials.encryptionKey | quote }}
  {{- end }}
{{- end }}
