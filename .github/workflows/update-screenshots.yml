name: Update README Visual Previews

on:
  workflow_dispatch:
    inputs:
      crt_preset:
        description: 'CRT Display Studio optical preset'
        required: false
        default: 'pvm'
        type: choice
        options:
          - pvm
          - subtle
          - arcade
          - bvm
      create_pr:
        description: 'Open or update PR with captured WebP assets'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/index.css'
      - 'src/components/**'
      - 'src/shared/crtDisplay.ts'
      - 'scripts/capture-screenshots/**'
      - '.github/workflows/update-screenshots.yml'

concurrency:
  group: update-readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture-previews:
    name: Capture CRT Visual Previews (Playwright + FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install dependencies & build production frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-package-lock --legacy-peer-deps
          fi
          npm run build

      - name: Install Playwright Chromium (ephemeral, outside package.json)
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps playwright
          npx playwright install --with-deps chromium

      - name: Capture animated walkthrough & static screenshots
        env:
          CAPTURE_CRT_PRESET: ${{ inputs.crt_preset || 'pvm' }}
          CAPTURE_UI_MOTION: 'low'
        run: |
          npm run capture:screenshots -- --preset "$CAPTURE_CRT_PRESET" --motion low
          ls -lh docs/assets/screenshots/

      - name: Upload preview bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-visual-previews
          path: docs/assets/screenshots/*.webp
          retention-days: 14

      - name: Check for changed screenshot assets
        id: diff
        run: |
          if [ -n "$(git status --porcelain -- docs/assets/screenshots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update pull request with visual previews
        if: steps.diff.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.create_pr != false)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: chore/update-readme-screenshots
          CRT_PRESET: ${{ inputs.crt_preset || 'pvm' }}
          MOTION_LEVEL: 'low'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH_NAME"
          git add docs/assets/screenshots/*.webp
          git commit -m "docs(screenshots): refresh automated CRT visual previews"
          git push --force origin "$BRANCH_NAME"

          RAW_BASE="https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH_NAME}/docs/assets/screenshots"
          PR_BODY=$(cat <<EOF
          ## Automated CRT Visual Preview Refresh

          Generated automatically via headless Chromium (**Playwright**) + **FFmpeg** against an isolated ephemeral demo SQLite library.

          - **CRT Optical Preset:** \`${CRT_PRESET}\`
          - **Living UI Motion:** \`${MOTION_LEVEL}\` (with **Sync Speed Wave** enabled)
          - **Phosphor Palette:** Classic **Green** primary views + **Amber** highlight on SD Card Exporter

          ### Hero Animated Walkthrough
          <p align="center">
            <img src="${RAW_BASE}/console-walkthrough.webp" alt="CRT Console Walkthrough" width="840" />
          </p>

          ### Static Screenshots (1440×900 WebP)

          | Sync Overview & Telemetry | Offline Box-Art Catalog |
          | :---: | :---: |
          | <img src="${RAW_BASE}/sync-overview.webp" alt="Sync Overview" width="420" /> | <img src="${RAW_BASE}/catalog-grid.webp" alt="Catalog Box-Art Grid" width="420" /> |

          | Game Detail Drawer | Direct-to-SD-Card Exporter (Amber) |
          | :---: | :---: |
          | <img src="${RAW_BASE}/game-detail-drawer.webp" alt="Game Detail Drawer" width="420" /> | <img src="${RAW_BASE}/sd-card-exporter.webp" alt="SD Card Exporter" width="420" /> |
          EOF
          )

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "docs: refresh README CRT visual previews" \
              --body "$PR_BODY"
            echo "Updated existing PR #${EXISTING_PR}"
          else
            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "docs: refresh README CRT visual previews" \
              --body "$PR_BODY"
          fi
