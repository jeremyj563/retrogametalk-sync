name: Update README Visual Previews

on:
  workflow_dispatch:
    inputs:
      crt_preset:
        description: 'CRT Display Studio optical preset'
        required: false
        default: 'pvm'
        type: choice
        options:
          - pvm
          - subtle
          - arcade
          - bvm
      publish_release:
        description: 'Upload captured WebP assets to the readme-assets GitHub Release'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'src/App.tsx'
      - 'src/index.css'
      - 'src/components/**'
      - 'src/shared/crtDisplay.ts'
      - 'scripts/capture-screenshots/**'
      - '.github/workflows/update-screenshots.yml'

concurrency:
  group: update-readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture-previews:
    name: Capture & Publish CRT Visual Previews
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure FFmpeg is installed
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install dependencies & build production frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --no-package-lock --legacy-peer-deps
          fi
          npm run build

      - name: Install Playwright Chromium (ephemeral, outside package.json)
        run: |
          npm install --no-save --no-package-lock --legacy-peer-deps playwright
          npx playwright install --with-deps chromium

      - name: Capture animated walkthrough & static screenshots
        env:
          CAPTURE_CRT_PRESET: ${{ inputs.crt_preset || 'pvm' }}
          CAPTURE_UI_MOTION: 'low'
        run: |
          npm run capture:screenshots -- --preset "$CAPTURE_CRT_PRESET" --motion low
          ls -lh docs/assets/screenshots/

      - name: Upload preview bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-visual-previews
          path: docs/assets/screenshots/*.webp
          retention-days: 14

      - name: Publish visual previews to readme-assets GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: readme-assets
          RELEASE_TITLE: 'README Visual Previews (Managed Asset Bucket)'
          CRT_PRESET: ${{ inputs.crt_preset || 'pvm' }}
          MOTION_LEVEL: 'low'
        run: |
          set -euo pipefail

          shopt -s nullglob
          ASSETS=(docs/assets/screenshots/*.webp)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "Error: No WebP screenshot assets found in docs/assets/screenshots/." >&2
            exit 1
          fi

          CAPTURED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ASSET_BASE="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}"

          RELEASE_NOTES=$(cat <<EOF
          Automated visual preview assets rendered by \`README.md\`.

          > **Note:** This pre-release is a rolling asset bucket managed automatically by \`.github/workflows/update-screenshots.yml\`. Hosting screenshots as GitHub Release assets keeps binary images completely out of git history and repository clones.

          - **Captured Commit:** \`${SHORT_SHA}\`
          - **Captured At (UTC):** \`${CAPTURED_AT}\`
          - **CRT Optical Preset:** \`${CRT_PRESET}\`
          - **Living UI Motion:** \`${MOTION_LEVEL}\` (with **Sync Speed Wave** enabled)
          - **Phosphor Palette:** Classic **Green** primary views + **Amber** highlight on SD Card Exporter
          EOF
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --prerelease \
              --latest=false \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
            echo "Updated existing release '${RELEASE_TAG}' with ${#ASSETS[@]} WebP assets."
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES"
            echo "Created release '${RELEASE_TAG}' with ${#ASSETS[@]} WebP assets."
          fi

          {
            echo "## Published README Visual Previews (\`${RELEASE_TAG}\`)"
            echo ""
            echo "Uploaded **${#ASSETS[@]}** WebP assets to [\`${RELEASE_TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}) without adding binary blobs to git history."
            echo ""
            echo "| Asset | Size | Direct URL |"
            echo "| :--- | ---: | :--- |"
            for asset in "${ASSETS[@]}"; do
              fname=$(basename "$asset")
              fsize=$(du -h "$asset" | cut -f1)
              echo "| \`${fname}\` | ${fsize} | [\`${fname}\`](${ASSET_BASE}/${fname}) |"
            done
            echo ""
            echo "### Hero Walkthrough Preview"
            echo "<p align=\"center\"><img src=\"${ASSET_BASE}/console-walkthrough.webp\" alt=\"CRT Console Walkthrough\" width=\"800\" /></p>"
          } >> "$GITHUB_STEP_SUMMARY"
