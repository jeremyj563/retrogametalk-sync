name: Release and Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_major_bump:
        description: "Allow MAJOR version >= 2 when minting a release tag"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate Deployment Templates & Helm Chart
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose, TrueNAS YAML, Unraid XML & Helm Chart
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils >/dev/null
          xmllint --noout deploy/unraid/retrogametalk-sync.xml deploy/unraid/ca_profile.xml
          docker compose -f docker-compose.yml config -q
          docker compose -f deploy/truenas/docker-compose.yaml config -q
          helm lint k8s/charts/retrogametalk-sync

  release:
    name: Validate SemVer, Tag & Create GitHub Release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.mint.outputs.release_tag }}
      semver_full: ${{ steps.mint.outputs.semver_full }}
      semver_minor: ${{ steps.mint.outputs.semver_minor }}
      release_date: ${{ steps.mint.outputs.release_date }}
      minted: ${{ steps.mint.outputs.minted }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate 1.x.y SemVer & mint tag + GitHub Release
        id: mint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_MAJOR_INPUT: ${{ inputs.allow_major_bump }}
          ALLOW_MAJOR_VAR: ${{ vars.ALLOW_MAJOR_VERSION_BUMP }}
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -e "const p=require('./package.json'); console.log(String(p.version||'').trim())")"
          if [[ ! "$PKG_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json version '$PKG_VERSION' is not strict X.Y.Z SemVer."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"

          if [ "$MAJOR" -ne 1 ] && [ "${ALLOW_MAJOR_INPUT:-false}" != "true" ] && [ "${ALLOW_MAJOR_VAR:-false}" != "true" ]; then
            echo "::error::Version ${PKG_VERSION} violates the 1.x.y SemVer constraint (MAJOR=${MAJOR}). Explicit approval is required to unlock MAJOR >= 2."
            exit 1
          fi

          CHART_VERSION="$(sed -nE 's/^version:[[:space:]]*["'\'']?([^"'\''[:space:]]+)["'\'']?/\1/p' k8s/charts/retrogametalk-sync/Chart.yaml | head -n 1)"
          if [ -z "$CHART_VERSION" ] || [ "$CHART_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Helm Chart version ($CHART_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

          CHART_APP_VERSION="$(sed -nE 's/^appVersion:[[:space:]]*["'\'']?([^"'\''[:space:]]+)["'\'']?/\1/p' k8s/charts/retrogametalk-sync/Chart.yaml | head -n 1)"
          if [ -z "$CHART_APP_VERSION" ] || [ "$CHART_APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Helm Chart appVersion ($CHART_APP_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

          TAG="${PKG_VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping duplicate tag/release creation."
            EXISTING_DATE="$(git show -s --format=%cI "refs/tags/${TAG}^{commit}" 2>/dev/null || git show -s --format=%cI HEAD)"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "semver_full=" >> "$GITHUB_OUTPUT"
            echo "semver_minor=" >> "$GITHUB_OUTPUT"
            echo "release_date=${EXISTING_DATE}" >> "$GITHUB_OUTPUT"
            echo "minted=false" >> "$GITHUB_OUTPUT"
          else
            PREV_TAG="$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"

            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "GitHub Release ${TAG} already exists; skipping creation."
            else
              NOTES_FILE="$(mktemp)"
              TAG="$TAG" PREV_TAG="$PREV_TAG" REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY}:${TAG}" node -e '
                const fs = require("node:fs");
                const { execFileSync } = require("node:child_process");
                const tag = process.env.TAG;
                const prevTag = (process.env.PREV_TAG || "").trim();
                const repoUrl = process.env.REPO_URL;
                const imageRef = process.env.IMAGE_REF;

                let section = "";
                if (fs.existsSync("CHANGELOG.md")) {
                  const raw = fs.readFileSync("CHANGELOG.md", "utf8");
                  const escaped = tag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                  const headingRe = new RegExp(`^##\\s+\\[?v?${escaped}\\]?(?:\\s+-\\s+.*)?$`, "m");
                  const match = headingRe.exec(raw);
                  if (match) {
                    const afterHeading = raw.slice(match.index + match[0].length);
                    const nextHeading = afterHeading.search(/^##\s+/m);
                    section = (nextHeading === -1 ? afterHeading : afterHeading.slice(0, nextHeading)).trim();
                  }
                }

                if (!section) {
                  try {
                    const range = prevTag ? `${prevTag}..HEAD` : "-n 10";
                    const args = prevTag
                      ? ["log", range, "--no-merges", "--pretty=format:- %s (%h)"]
                      : ["log", "-n", "10", "--no-merges", "--pretty=format:- %s (%h)"];
                    section = execFileSync("git", args, { encoding: "utf8" }).trim();
                  } catch {
                    section = "";
                  }
                }

                const parts = ["## Summary of Changes", "", section || `- Release ${tag}`];
                parts.push("", "---", `**Container Image:** \`${imageRef}\``);
                if (prevTag && prevTag !== tag) {
                  parts.push(`**Full Changelog:** ${repoUrl}/compare/${prevTag}...${tag}`);
                }
                process.stdout.write(parts.join("\n") + "\n");
              ' > "$NOTES_FILE"

              gh release create "${TAG}" \
                --target "${GITHUB_SHA}" \
                --title "${TAG}" \
                --notes-file "${NOTES_FILE}"
              rm -f "$NOTES_FILE"
            fi

            RELEASE_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "semver_full=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
            echo "semver_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
            echo "release_date=${RELEASE_DATE}" >> "$GITHUB_OUTPUT"
            echo "minted=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Native (${{ matrix.platform }})
    needs: [validate, release]
    if: always() && needs.validate.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build provenance & registry image
        id: version
        env:
          MINTED_TAG: ${{ needs.release.outputs.release_tag }}
          MINTED_RELEASE_DATE: ${{ needs.release.outputs.release_date }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            GIT_TAG="${{ github.ref_name }}"
          elif [ -n "$MINTED_TAG" ]; then
            GIT_TAG="$MINTED_TAG"
          else
            GIT_TAG="$(git tag --points-at HEAD | head -n 1 || true)"
          fi

          if [ -n "$GIT_TAG" ]; then
            APP_VERSION="$GIT_TAG"
            GIT_REF="refs/tags/${GIT_TAG}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            APP_VERSION="${{ github.head_ref || github.ref_name }}"
            GIT_REF="${{ github.ref }}"
          else
            APP_VERSION="${{ github.ref_name }}"
            GIT_REF="${{ github.ref }}"
          fi

          if [ -n "$MINTED_RELEASE_DATE" ]; then
            BUILT_AT="$MINTED_RELEASE_DATE"
          else
            BUILT_AT="$(git show -s --format=%cI HEAD 2>/dev/null || date -u +"%Y-%m-%dT%H:%M:%SZ")"
          fi

          GHCR_IMAGE="$(printf '%s/%s' "${{ env.REGISTRY }}" "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          BUILD_OUTPUTS=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            BUILD_OUTPUTS="type=image,name=${GHCR_IMAGE},push-by-digest=true,name-canonical=true,push=true"
          fi

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "built_at=${BUILT_AT}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "build_outputs=${BUILD_OUTPUTS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.ghcr_image }}

      - name: Build native image (push by digest on non-PR)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          outputs: ${{ steps.version.outputs.build_outputs }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.app_version }}
            GIT_URL=${{ github.server_url }}/${{ github.repository }}
            GIT_REF=${{ steps.version.outputs.git_ref }}
            BUILT_AT=${{ steps.version.outputs.built_at }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      - name: Export platform digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::Build did not emit an image digest for ${{ matrix.platform }}."
            exit 1
          fi
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifests & Publish OCI Helm Chart
    needs: [release, build]
    if: github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Resolve tags & Docker Hub gate
        id: version
        env:
          MINTED_TAG: ${{ needs.release.outputs.release_tag }}
          MINTED_SEMVER_FULL: ${{ needs.release.outputs.semver_full }}
          MINTED_SEMVER_MINOR: ${{ needs.release.outputs.semver_minor }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_REPO_VAR: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            GIT_TAG="${{ github.ref_name }}"
          elif [ -n "$MINTED_TAG" ]; then
            GIT_TAG="$MINTED_TAG"
          else
            GIT_TAG="$(git tag --points-at HEAD | head -n 1 || true)"
          fi

          SEMVER_FULL="${MINTED_SEMVER_FULL}"
          SEMVER_MINOR="${MINTED_SEMVER_MINOR}"
          if [[ "$GIT_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            SEMVER_FULL="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            SEMVER_MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi

          GHCR_IMAGE="$(printf '%s/%s' "${{ env.REGISTRY }}" "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          DOCKERHUB_ENABLED="false"
          DOCKERHUB_IMAGE=""
          if [ -n "$SEMVER_FULL" ] && [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            DOCKERHUB_ENABLED="true"
            DH_REPO="${DH_REPO_VAR:-${DH_USER}/retrogametalk-sync}"
            DOCKERHUB_IMAGE="$(printf 'docker.io/%s' "${DH_REPO}" | tr '[:upper:]' '[:lower:]')"
          fi

          echo "semver_full=${SEMVER_FULL}" >> "$GITHUB_OUTPUT"
          echo "semver_minor=${SEMVER_MINOR}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_enabled=${DOCKERHUB_ENABLED}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_image=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (Release Tags Only, When Configured)
        if: steps.version.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute GHCR tags
        id: meta_ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.ghcr_image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.semver_full }},enable=${{ steps.version.outputs.semver_full != '' }}
            type=raw,value=${{ steps.version.outputs.semver_minor }},enable=${{ steps.version.outputs.semver_minor != '' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compute Docker Hub tags (Release Tags Only)
        if: steps.version.outputs.dockerhub_enabled == 'true'
        id: meta_dockerhub
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.dockerhub_image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.semver_full }}
            type=raw,value=${{ steps.version.outputs.semver_minor }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create multi-arch manifest list on GHCR
        working-directory: ${{ runner.temp }}/digests
        env:
          GHCR_IMAGE: ${{ steps.version.outputs.ghcr_image }}
          GHCR_TAGS: ${{ steps.meta_ghcr.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t TAG_LIST < <(printf '%s\n' "$GHCR_TAGS" | sed '/^$/d')
          TAG_ARGS=()
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS+=(-t "$t")
          done

          DIGEST_REFS=()
          for f in *; do
            DIGEST_REFS+=("${GHCR_IMAGE}@sha256:${f}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"
          docker buildx imagetools inspect "${TAG_LIST[0]}"

      - name: Mirror multi-arch manifest list to Docker Hub (When Configured)
        if: steps.version.outputs.dockerhub_enabled == 'true'
        working-directory: ${{ runner.temp }}/digests
        env:
          GHCR_IMAGE: ${{ steps.version.outputs.ghcr_image }}
          DH_TAGS: ${{ steps.meta_dockerhub.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t TAG_LIST < <(printf '%s\n' "$DH_TAGS" | sed '/^$/d')
          TAG_ARGS=()
          for t in "${TAG_LIST[@]}"; do
            TAG_ARGS+=(-t "$t")
          done

          DIGEST_REFS=()
          for f in *; do
            DIGEST_REFS+=("${GHCR_IMAGE}@sha256:${f}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_REFS[@]}"
          docker buildx imagetools inspect "${TAG_LIST[0]}"

      - name: Publish Helm Chart to GHCR OCI Registry
        if: steps.version.outputs.semver_full != ''
        env:
          HELM_EXPERIMENTAL_OCI: "1"
        run: |
          set -euo pipefail
          REPO_OWNER="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p /tmp/helm-dist
          helm package k8s/charts/retrogametalk-sync -d /tmp/helm-dist
          helm push "/tmp/helm-dist/retrogametalk-sync-${{ steps.version.outputs.semver_full }}.tgz" "oci://ghcr.io/${REPO_OWNER}/charts"
