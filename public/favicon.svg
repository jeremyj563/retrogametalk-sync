<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <clipPath id="rgt-fav-screen">
      <rect x="11.5" y="18" width="41" height="27.5" rx="3.2" />
    </clipPath>
    <radialGradient id="rgt-fav-glow" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#38e56b" stop-opacity="0.28" />
      <stop offset="65%" stop-color="#38e56b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a08" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rgt-fav-shell" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16221a" />
      <stop offset="100%" stop-color="#0b110d" />
    </linearGradient>
  </defs>

  <!-- Outer Sculpted 16-Bit ROM Cartridge Shell -->
  <path
    d="M11.5 3.5H54A6.5 6.5 0 0 1 60.5 10V49.5L57.5 52.5V56.5A4 4 0 0 1 53.5 60.5H10.5A4 4 0 0 1 6.5 56.5V52.5L3.5 49.5V11.5L11.5 3.5Z"
    fill="url(#rgt-fav-shell)"
    stroke="#35523e"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Top Bevel Specular Highlight -->
  <path
    d="M12.3 5.6H53.5A4.5 4.5 0 0 1 58 10"
    stroke="#38e56b"
    stroke-opacity="0.4"
    stroke-width="1.2"
    stroke-linecap="round"
  />

  <!-- Side Molded Grip Indents -->
  <g fill="#070a08" opacity="0.9">
    <rect x="4.5" y="23" width="2.4" height="2.6" rx="0.6" />
    <rect x="4.5" y="28" width="2.4" height="2.6" rx="0.6" />
    <rect x="4.5" y="33" width="2.4" height="2.6" rx="0.6" />
    <rect x="57.1" y="23" width="2.4" height="2.6" rx="0.6" />
    <rect x="57.1" y="28" width="2.4" height="2.6" rx="0.6" />
    <rect x="57.1" y="33" width="2.4" height="2.6" rx="0.6" />
  </g>

  <!-- Top Molded Cartridge Grip Ribs & Insertion Arrow -->
  <rect x="15" y="7.5" width="27" height="1.9" rx="0.95" fill="#35523e" />
  <rect x="15" y="10.9" width="27" height="1.9" rx="0.95" fill="#2c4333" />
  <rect x="15" y="14.2" width="27" height="1.4" rx="0.7" fill="#1e2d23" />
  <path d="M49.5 7.5 52.9 12.8H46.1L49.5 7.5Z" fill="#38e56b" fill-opacity="0.72" />

  <!-- Recessed Inner CRT Label Screen Bezel -->
  <rect
    x="10.5"
    y="17"
    width="43"
    height="29.5"
    rx="4.2"
    fill="#070a08"
    stroke="#38e56b"
    stroke-opacity="0.88"
    stroke-width="2"
  />

  <g clip-path="url(#rgt-fav-screen)">
    <!-- Soft CRT Phosphor Screen Bloom -->
    <rect x="11.5" y="18" width="41" height="27.5" fill="url(#rgt-fav-glow)" />

    <!-- Subtle Calibration Grid -->
    <g stroke="#38e56b" stroke-opacity="0.16" stroke-width="0.7">
      <line x1="11.5" y1="25" x2="52.5" y2="25" />
      <line x1="11.5" y1="31.75" x2="52.5" y2="31.75" />
      <line x1="11.5" y1="38.5" x2="52.5" y2="38.5" />
      <line x1="22" y1="18" x2="22" y2="45.5" />
      <line x1="32" y1="18" x2="32" y2="45.5" />
      <line x1="42" y1="18" x2="42" y2="45.5" />
    </g>

    <!-- Bold Centered Sync Chevrons (>>>) Optimized for 16px & 32px Tabs -->
    <g
      fill="none"
      stroke="#38e56b"
      stroke-width="3.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="15.5,24.8 22.3,31.75 15.5,38.7" opacity="0.76" />
      <polyline points="27.6,24.8 34.4,31.75 27.6,38.7" opacity="1" />
      <polyline points="39.7,24.8 46.5,31.75 39.7,38.7" opacity="0.9" />
    </g>

    <!-- Curved Trinitron Glass Corner Glint -->
    <path
      d="M14 20.5H21.5M14 20.5V25"
      stroke="#ffffff"
      stroke-opacity="0.28"
      stroke-width="1.2"
      stroke-linecap="round"
    />
  </g>

  <!-- Recessed Bottom PCB Edge Connector Shroud & 7-Pin ROM Bus -->
  <rect
    x="10.5"
    y="50.2"
    width="35"
    height="7.4"
    rx="1.5"
    fill="#070a08"
    stroke="#1e2d23"
    stroke-width="1.1"
  />
  <g fill="#2c4333">
    <rect x="12.5" y="51.7" width="3.2" height="4.4" rx="0.55" />
    <rect x="17.3" y="51.7" width="3.2" height="4.4" rx="0.55" />
    <rect x="22.1" y="51.7" width="3.2" height="4.4" rx="0.55" fill="#38e56b" opacity="0.45" />
    <rect x="26.9" y="51.7" width="3.2" height="4.4" rx="0.55" fill="#38e56b" />
    <rect x="31.7" y="51.7" width="3.2" height="4.4" rx="0.55" />
    <rect x="36.5" y="51.7" width="3.2" height="4.4" rx="0.55" />
    <rect x="41.3" y="51.7" width="3.2" height="4.4" rx="0.55" />
  </g>

  <!-- Dual-Ring Power / Sync Activity LED -->
  <circle cx="51.8" cy="53.9" r="4.1" fill="#070a08" stroke="#35523e" stroke-width="1.1" />
  <circle cx="51.8" cy="53.9" r="2.6" fill="#38e56b" />
  <circle cx="51.1" cy="53.1" r="0.75" fill="#ffffff" fill-opacity="0.75" />
</svg>
