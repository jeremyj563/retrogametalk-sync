<svg xmlns="http://www.w3.org/2000/svg" width="840" height="176" viewBox="0 0 840 176" role="img" aria-label="RetroGameTalk Sync Logo">
  <defs>
    <linearGradient id="bg-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d0a" />
      <stop offset="60%" stop-color="#0b1510" />
      <stop offset="100%" stop-color="#0d1c14" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d7a3a" stop-opacity="0.2" />
      <stop offset="55%" stop-color="#38e56b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="crt-vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a160f" />
      <stop offset="100%" stop-color="#040806" />
    </linearGradient>
    <clipPath id="screen-clip">
      <rect x="65" y="61" width="76" height="51" rx="6" />
    </clipPath>
    <clipPath id="track-clip">
      <rect x="206" y="114" width="568" height="8" rx="4" />
    </clipPath>
  </defs>

  <!-- Outer Hardware Chassis Card (readable on both GitHub Light and Dark themes) -->
  <rect x="4" y="4" width="832" height="168" rx="18" fill="url(#bg-card)" stroke="#1f3b2a" stroke-width="2" />
  <rect x="12" y="12" width="816" height="152" rx="13" fill="none" stroke="#14281c" stroke-width="1" />

  <!-- Subtle Horizontal Scanline Backdrop across Chassis -->
  <g stroke="#38e56b" stroke-opacity="0.04" stroke-width="1">
    <line x1="20" y1="28" x2="820" y2="28" />
    <line x1="20" y1="40" x2="820" y2="40" />
    <line x1="20" y1="52" x2="820" y2="52" />
    <line x1="20" y1="64" x2="820" y2="64" />
    <line x1="20" y1="76" x2="820" y2="76" />
    <line x1="20" y1="88" x2="820" y2="88" />
    <line x1="20" y1="100" x2="820" y2="100" />
    <line x1="20" y1="112" x2="820" y2="112" />
    <line x1="20" y1="124" x2="820" y2="124" />
    <line x1="20" y1="136" x2="820" y2="136" />
    <line x1="20" y1="148" x2="820" y2="148" />
  </g>

  <!-- Sculpted 16-Bit / Arcade ROM Cartridge Emblem (centered around x=44..162, y=28..148) -->
  <g transform="translate(44, 28)">
    <!-- Cartridge Shell with Top-Left Chamfer Notch & Bottom PCB Skirt -->
    <path
      d="M21.5 6.5H101A12 12 0 0 1 113 18.5V92.5L107.5 98V105.5A7.5 7.5 0 0 1 100 113H19.5A7.5 7.5 0 0 1 12 105.5V98L6.5 92.5V21.5L21.5 6.5Z"
      fill="#0f1b14"
      stroke="#2f573d"
      stroke-width="3.2"
      stroke-linejoin="round"
    />

    <!-- Top Bevel Specular Highlight -->
    <path
      d="M23 10.5H100A8.5 8.5 0 0 1 108.5 19"
      fill="none"
      stroke="#38e56b"
      stroke-opacity="0.35"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Molded Side Grip Indents -->
    <g fill="#070d0a" opacity="0.9">
      <rect x="8.5" y="43" width="4" height="5" rx="1" />
      <rect x="8.5" y="52" width="4" height="5" rx="1" />
      <rect x="8.5" y="61" width="4" height="5" rx="1" />
      <rect x="107" y="43" width="4" height="5" rx="1" />
      <rect x="107" y="52" width="4" height="5" rx="1" />
      <rect x="107" y="61" width="4" height="5" rx="1" />
    </g>

    <!-- Top Cartridge Grip Ribs + Insertion Arrow -->
    <rect x="28" y="14" width="50" height="3.2" rx="1.6" fill="#294834" />
    <rect x="28" y="20" width="50" height="3.2" rx="1.6" fill="#294834" />
    <rect x="28" y="26" width="50" height="2.6" rx="1.3" fill="#203828" />
    <path d="M92 14.5 98 23.5H86L92 14.5Z" fill="#38e56b" fill-opacity="0.7" />

    <!-- Recessed Inner CRT Label Screen Bezel -->
    <rect
      x="19.5"
      y="31.5"
      width="80"
      height="55"
      rx="7.5"
      fill="url(#crt-vignette)"
      stroke="#238c45"
      stroke-width="2.6"
    />
  </g>

  <!-- Clipped CRT Screen Details -->
  <g clip-path="url(#screen-clip)">
    <!-- Calibration Grid -->
    <g stroke="#38e56b" stroke-opacity="0.16" stroke-width="1">
      <line x1="65" y1="74" x2="141" y2="74" />
      <line x1="65" y1="86.5" x2="141" y2="86.5" />
      <line x1="65" y1="99" x2="141" y2="99" />
      <line x1="84" y1="61" x2="84" y2="112" />
      <line x1="103" y1="61" x2="103" y2="112" />
      <line x1="122" y1="61" x2="122" y2="112" />
    </g>

    <!-- Sync Chevrons (>>>) -->
    <g fill="none" stroke="#38e56b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="72,74 84,86.5 72,99" opacity="0.45" />
      <polyline points="92,74 104,86.5 92,99" opacity="0.82" />
      <polyline points="112,74 124,86.5 112,99" opacity="1" />
    </g>

    <!-- Phosphor Scanline Accent -->
    <rect x="65" y="84" width="76" height="3.5" fill="#38e56b" fill-opacity="0.18" />

    <!-- Trinitron Curved Glass Corner Glint -->
    <path d="M70 66H84M70 66V75" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom PCB Connector Pins + Dual-Ring Activity LED -->
  <g transform="translate(44, 28)">
    <rect x="19.5" y="93.5" width="65" height="13.5" rx="2.8" fill="#060b08" stroke="#1f3b2a" stroke-width="1.6" />
    <rect x="23.5" y="96.5" width="5.8" height="7.8" rx="1" fill="#23422e" />
    <rect x="32.3" y="96.5" width="5.8" height="7.8" rx="1" fill="#23422e" />
    <rect x="41.1" y="96.5" width="5.8" height="7.8" rx="1" fill="#38e56b" fill-opacity="0.45" />
    <rect x="49.9" y="96.5" width="5.8" height="7.8" rx="1" fill="#38e56b" />
    <rect x="58.7" y="96.5" width="5.8" height="7.8" rx="1" fill="#23422e" />
    <rect x="67.5" y="96.5" width="5.8" height="7.8" rx="1" fill="#23422e" />
    <rect x="76.3" y="96.5" width="5.8" height="7.8" rx="1" fill="#23422e" />

    <!-- Dual-Ring Activity LED -->
    <circle cx="96.5" cy="100.3" r="7.5" fill="#060b08" stroke="#2f573d" stroke-width="1.6" />
    <circle cx="96.5" cy="100.3" r="4.5" fill="#38e56b" />
    <circle cx="95.2" cy="98.9" r="1.3" fill="#ffffff" fill-opacity="0.7" />
  </g>

  <!-- Right Side Typography & Telemetry Lockup -->
  <!-- Upper Calibration Horizon Rail -->
  <rect x="206" y="44" width="568" height="2" rx="1" fill="#183022" />
  <rect x="206" y="44" width="176" height="2" rx="1" fill="#38e56b" fill-opacity="0.7" />
  <text x="206" y="38" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2.2" fill="#5da878">SELF-HOSTED ROM REPOSITORY MIRROR &amp; HANDHELD CONSOLE</text>

  <!-- Primary Display Wordmark -->
  <text x="206" y="96" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="800" letter-spacing="1.6" fill="#ecfdf3">RETROGAMETALK</text>
  <rect x="614" y="59" width="160" height="44" rx="7" fill="#102b1b" stroke="#2f854d" stroke-width="1.8" />
  <text x="694" y="91" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="800" letter-spacing="3.2" fill="#38e56b">SYNC</text>

  <!-- Segmented VFD Telemetry Bar -->
  <rect x="206" y="114" width="568" height="8" rx="4" fill="#112218" />
  <g clip-path="url(#track-clip)">
    <rect x="206" y="114" width="320" height="8" rx="4" fill="url(#beam-grad)" />
    <g stroke="#08100c" stroke-width="2">
      <line x1="246" y1="114" x2="246" y2="122" />
      <line x1="286" y1="114" x2="286" y2="122" />
      <line x1="326" y1="114" x2="326" y2="122" />
      <line x1="366" y1="114" x2="366" y2="122" />
      <line x1="406" y1="114" x2="406" y2="122" />
      <line x1="446" y1="114" x2="446" y2="122" />
      <line x1="486" y1="114" x2="486" y2="122" />
      <line x1="526" y1="114" x2="526" y2="122" />
      <line x1="566" y1="114" x2="566" y2="122" />
      <line x1="606" y1="114" x2="606" y2="122" />
      <line x1="646" y1="114" x2="646" y2="122" />
      <line x1="686" y1="114" x2="686" y2="122" />
      <line x1="726" y1="114" x2="726" y2="122" />
    </g>
  </g>

  <!-- Footer Spec Line -->
  <text x="206" y="142" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.2" fill="#7fc899">ADAPTIVE AIMD PACING  •  SQLITE + WAL  •  80+ CONSOLES  •  DIRECT SD INSTALLER  •  AMD64 + ARM64</text>
</svg>
