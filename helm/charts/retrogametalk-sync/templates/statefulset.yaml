apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "retrogametalk-sync.fullname" . }}
  labels:
    {{- include "retrogametalk-sync.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "retrogametalk-sync.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "retrogametalk-sync.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "retrogametalk-sync.selectorLabels" . | nindent 8 }}
      {{- $podAnnotations := dict -}}
      {{- if .Values.metrics.prometheusScrape -}}
        {{- $_ := set $podAnnotations "prometheus.io/scrape" "true" -}}
        {{- $_ := set $podAnnotations "prometheus.io/port" (.Values.scraper.port | toString) -}}
        {{- $_ := set $podAnnotations "prometheus.io/path" "/metrics" -}}
      {{- end -}}
      {{- range $k, $v := .Values.podAnnotations -}}
        {{- $_ := set $podAnnotations $k ($v | toString) -}}
      {{- end -}}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.scraper.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "retrogametalk-sync.fullname" . }}-config
            - secretRef:
                name: {{ include "retrogametalk-sync.secretName" . }}
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "retrogametalk-sync.pvcName" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
