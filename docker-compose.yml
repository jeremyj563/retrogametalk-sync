services:
  rgt-sync:
    build: .
    container_name: rgt-sync
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /run/repo
      DOWNLOAD_DIR: /run/repo/repository
      CRON_SCHEDULE: "0 */6 * * *"
      RGT_BASE_URL: "https://retrogametalk.com/repo/"
      RGT_LOGIN_URL: "https://retrogametalk.com/login/"
      RGT_USERNAME: "${RGT_USERNAME:-}"
      RGT_PASSWORD: "${RGT_PASSWORD:-}"
      SCRAPER_SYSTEM_FILTER: "${SCRAPER_SYSTEM_FILTER:-}"
    volumes:
      - ./mirror-data:/run/repo
